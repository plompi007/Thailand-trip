<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>תאילנד 2026</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="app/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="app/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app/vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="top">
    <button id="regionBtn" class="region-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="region-ico" aria-hidden="true">🐘</span><span id="regionLabel">כל האזורים</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <span id="offline" class="offline" role="status" hidden>אופליין</span>
    <button id="searchBtn" class="icon-btn" type="button" aria-label="חיפוש מקום"><span aria-hidden="true">🔍</span></button>
    <button id="babyBtn" class="icon-btn toggle" type="button" aria-pressed="false" aria-label="רק מקומות קלים עם נאם" title="רק מקומות קלים עם נאם"><span aria-hidden="true">👶</span></button>
  </header>

  <nav id="cats" class="cats" aria-label="סינון לפי קטגוריה"></nav>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <button id="locateBtn" class="fab" type="button" aria-label="למיקום שלי"><span aria-hidden="true">⌖</span></button>
    </section>

    <section id="view-list" class="view">
      <div class="list-head">
        <input id="placeSearch" type="search" placeholder="חיפוש מקום…" aria-label="חיפוש מקום" autocomplete="off" enterkeyhint="search">
        <button id="originLine" class="origin-line" type="button"></button>
      </div>
      <ul id="list" class="list"></ul>
    </section>

    <section id="view-now" class="view">
      <div class="now-head">
        <h1 id="nowTitle" class="now-title"></h1>
        <button id="originLineNow" class="origin-line" type="button"></button>
      </div>
      <ul id="nowList" class="list" aria-live="polite"></ul>
      <div class="now-foot"><button id="shuffleBtn" class="btn wide" type="button">🔀 תציע משהו אחר</button></div>
    </section>

    <section id="view-dict" class="view">
      <div class="list-head">
        <input id="dictSearch" type="search" placeholder="חיפוש מנה (עברית / תאית)" aria-label="חיפוש מנה" autocomplete="off" enterkeyhint="search">
        <div id="dictTags" class="chip-row" role="group" aria-label="סינון מנות"></div>
      </div>
      <details class="phrases">
        <summary>💬 משפטים שימושיים במסעדה</summary>
        <ul id="phraseList" class="list"></ul>
      </details>
      <ul id="dictList" class="list"></ul>
    </section>
  </main>

  <nav class="tabs" aria-label="תצוגה">
    <button data-view="map" class="active" type="button" aria-current="page"><b aria-hidden="true">🗺️</b><span>מפה</span></button>
    <button data-view="list" type="button"><b aria-hidden="true">📋</b><span>רשימה</span></button>
    <button data-view="now" type="button"><b aria-hidden="true">✨</b><span>מה עושים?</span></button>
    <button data-view="dict" type="button"><b aria-hidden="true">📖</b><span>מילון אוכל</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" tabindex="-1">
      <div class="handle" aria-hidden="true"></div>
      <button class="close" type="button" aria-label="סגירה"><span aria-hidden="true">✕</span></button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script src="app/vendor/leaflet/leaflet.js"></script>
  <script src="app/vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
